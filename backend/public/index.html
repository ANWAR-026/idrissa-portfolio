<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Idirissa Portfolio</title>
  <style>
    body {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f7fb;
      color: #111827;
      line-height: 1.6;
    }
    header {
      background: #111827;
      color: #fff;
      padding: 2rem 1rem;
      text-align: center;
    }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 1.5rem;
    }
    section {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      margin-bottom: 1.5rem;
      padding: 1.5rem;
    }
    h2 {
      margin-top: 0;
      color: #111827;
    }
    .project-card, .skill-group {
      margin-bottom: 1rem;
      padding: 1rem;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
    }
    .project-card img {
      max-width: 100%;
      border-radius: 12px;
      margin-bottom: 1rem;
    }
    label {
      display: block;
      margin-bottom: 0.35rem;
      font-weight: 600;
    }
    input, textarea {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 0.75rem;
      margin-bottom: 1rem;
      font-size: 1rem;
    }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0.9rem 1.4rem;
      cursor: pointer;
      font-weight: 700;
      transition: background 0.2s ease;
    }
    button:hover {
      background: #1d4ed8;
    }
    .message {
      padding: 0.9rem 1rem;
      border-radius: 10px;
      margin-top: 1rem;
    }
    .message.success {
      background: #d1fae5;
      color: #065f46;
    }
    .message.error {
      background: #fee2e2;
      color: #991b1b;
    }
  </style>
</head>
<body>
  <header>
    <h1>Idirissa Portfolio</h1>
    <p>Simple backend UI powered by the portfolio API</p>
  </header>
  <main>
    <section id="about">
      <h2>About</h2>
      <div id="about-content">Loading about info...</div>
    </section>

    <section id="skills">
      <h2>Skills</h2>
      <div id="skills-content">Loading skills...</div>
    </section>

    <section id="projects">
      <h2>Projects</h2>
      <div id="projects-content">Loading projects...</div>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <form id="contact-form">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" required />

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required />

        <label for="subject">Subject</label>
        <input id="subject" name="subject" type="text" required />

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="4" required></textarea>

        <button type="submit">Send Message</button>
      </form>
      <div id="contact-result"></div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
